<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AELORIA — its blessing to be Me</title>

  <!-- AELORIA FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500;600&family=Shadows+Into+Light+Two&display=swap" rel="stylesheet">

  <style>

    /* =========================
       AELORIA COLOUR PALETTE
    ========================== */

    :root {
      --vanilla: #FFF8E2;
      --butter: #FFEFB9;
      --walnut: #5E442E;
      --pomegranate: #C85555;
      --bistre: #767B39;
      --melon: #F7BCB0;
      --sky: #DDEEF5;
      --white: #FFFFFF;
    }


    /* =========================
       GENERAL
    ========================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--white);
      color: var(--walnut);
      font-family: "Playfair Display", serif;
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: min(1100px, 92%);
      margin: auto;
    }


    /* =========================
       TYPOGRAPHY
    ========================== */

    .brand-name {
      font-family: "Shadows Into Light Two", cursive;
      font-size: clamp(3rem, 10vw, 5.5rem);
      letter-spacing: 3px;
      line-height: 1;
    }

    h1,
    h2,
    h3 {
      font-family: "Great Vibes", cursive;
      font-weight: 400;
    }

    h2 {
      font-size: clamp(2.4rem, 6vw, 4rem);
      text-align: center;
      margin-bottom: 28px;
    }


    /* =========================
       HEADER
    ========================== */

    header {
      background: rgba(255, 248, 226, 0.96);
      text-align: center;
      padding: 28px 15px 18px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(94, 68, 46, 0.08);
    }

    header .brand-name {
      color: var(--walnut);
    }

    .tagline {
      margin-top: 5px;
      font-size: 0.95rem;
      font-style: italic;
    }

    nav {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
      font-size: 0.9rem;
    }

    nav a {
      transition: 0.25s ease;
    }

    nav a:hover {
      color: var(--pomegranate);
    }


    /* =========================
       HERO
    ========================== */

    .hero {
      min-height: 68vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;

      background:
        linear-gradient(
          rgba(255, 248, 226, 0.22),
          rgba(255, 248, 226, 0.35)
        ),
        url("https://images.unsplash.com/photo-1464207687429-7505649dae38?auto=format&fit=crop&w=1800&q=85");

      background-size: cover;
      background-position: center;
      padding: 60px 20px;
    }

    .hero-content {
      background: rgba(255, 255, 255, 0.78);
      padding: 35px 28px;
      border-radius: 24px;
      max-width: 650px;
      box-shadow: 0 12px 35px rgba(94, 68, 46, 0.12);
    }

    .hero h1 {
      font-size: clamp(3rem, 9vw, 5.5rem);
      margin-bottom: 8px;
    }

    .hero p {
      font-size: 1rem;
      margin-bottom: 22px;
    }


    /* =========================
       BUTTONS
    ========================== */

    .button {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 12px;
      background: var(--pomegranate);
      color: white;
      font-family: "Playfair Display", serif;
      border: none;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .button:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 18px rgba(94, 68, 46, 0.16);
    }


    /* =========================
       INTRO
    ========================== */

    .intro {
      padding: 80px 0 65px;
      text-align: center;
    }

    .intro p {
      max-width: 760px;
      margin: auto;
      font-size: 1.05rem;
    }


    /* =========================
       PRODUCT SECTION
    ========================== */

    .products {
      padding: 70px 0;
      background: var(--white);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
    }

    .product-card {
      background: var(--vanilla);
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 8px 25px rgba(94, 68, 46, 0.08);
      transition: transform 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    .product-image {
      height: 250px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      background: var(--butter);
    }

    .product-card h3 {
      font-family: "Playfair Display", serif;
      font-size: 1.05rem;
      margin: 15px 4px 4px;
    }

    .price {
      margin-left: 4px;
      color: var(--pomegranate);
      font-weight: 600;
    }

    .product-card .button {
      margin: 14px 4px 4px;
      font-size: 0.85rem;
    }


    /* =========================
       CATEGORIES
    ========================== */

    .categories {
      padding: 80px 0;

      background-color: var(--sky);

      background-image:
        repeating-linear-gradient(
          0deg,
          transparent 0 28px,
          rgba(255, 255, 255, 0.38) 28px 56px
        ),
        repeating-linear-gradient(
          90deg,
          transparent 0 28px,
          rgba(255, 255, 255, 0.38) 28px 56px
        );
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .category {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      padding: 35px 20px;
      text-align: center;
      transition: transform 0.25s ease;
    }

    .category:hover {
      transform: translateY(-4px);
    }

    .category h3 {
      font-size: 2rem;
      margin-bottom: 8px;
    }


    /* =========================
       ABOUT
    ========================== */

    .about {
      padding: 80px 0;
    }

    .about-box {
      max-width: 850px;
      margin: auto;
      background: var(--white);
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 8px 25px rgba(94, 68, 46, 0.07);
    }

    .about-box p {
      margin-bottom: 14px;
    }


    /* =========================
       SHOP INFO
    ========================== */

    .info {
      padding: 70px 0;
      background: var(--butter);
      text-align: center;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 18px;
      margin-top: 25px;
    }

    .info-card {
      background: rgba(255, 255, 255, 0.72);
      padding: 24px;
      border-radius: 18px;
    }

    .info-card strong {
      display: block;
      margin-bottom: 5px;
    }


    /* =========================
       CONTACT
    ========================== */

    .contact {
      padding: 80px 0;
      text-align: center;
    }

    .contact p {
      margin: 8px 0;
    }


    /* =========================
       FOOTER
    ========================== */

    footer {
      background: var(--walnut);
      color: var(--vanilla);
      text-align: center;
      padding: 45px 20px;
    }

    footer .brand-name {
      margin-bottom: 12px;
    }

    footer p {
      font-size: 0.9rem;
      opacity: 0.9;
    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {

      header {
        padding-top: 22px;
      }

      nav {
        gap: 11px 15px;
        font-size: 0.82rem;
      }

      .hero {
        min-height: 62vh;
        padding: 35px 15px;
      }

      .hero-content {
        padding: 28px 20px;
      }
